appId: com.pcobooster.ios
---
# Searches and opens a fixture song, then returns to its scoped recent result.
- tapOn: "Search"
- tapOn:
    id: "search-input"
- inputText: "morning light"
- tapOn:
    id: "search-filter-Songs"
- scrollUntilVisible:
    element:
      id: "search-result-5501"
    centerElement: true
- takeScreenshot: search-keyboard
- tapOn:
    id: "search-result-5501"
- extendedWaitUntil:
    visible:
      id: "song-facts"
    timeout: 30000
- takeScreenshot: search-song-destination
- tapOn: "Search"
- assertVisible:
    id: "search-input"
# One-character People searches show guidance rather than an empty loading state.
- tapOn:
    id: "search-input"
- eraseText
- inputText: "m"
- tapOn:
    id: "search-filter-People"
- assertVisible: "Type at least two characters to search people."
- takeScreenshot: search-short-query
