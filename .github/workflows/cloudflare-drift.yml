name: Cloudflare drift

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Compares each persistent stage's live Cloudflare resources with Alchemy's state and fails when
# any were changed outside a deploy (for example a Flagship flag, DNS record, or Access policy
# edited in the dashboard), before the next deploy silently overwrites them. It only reads; see
# scripts/cloudflare/check-drift.ts.

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: staging
            environment: cloudflare-staging
            concurrency: cloudflare-staging
          - stage: prod
            environment: production
            concurrency: cloudflare-prod
    name: drift (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ matrix.environment }}
    concurrency:
      # Shares the stage's deploy group, so a check never observes a half-applied deploy.
      group: ${{ matrix.concurrency }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PCOBOOSTER_ADMIN_EMAILS: ${{ vars.PCOBOOSTER_ADMIN_EMAILS }}
      STAGING_ACCESS_SERVICE_TOKEN_ID: ${{ vars.STAGING_ACCESS_SERVICE_TOKEN_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      # Set only in the production environment, as for its deploy.
      CLOUDFLARE_CUSTOM_DOMAINS: ${{ vars.CLOUDFLARE_CUSTOM_DOMAINS }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Check ${{ matrix.stage }} for drift
        env:
          STAGE: ${{ matrix.stage }}
        run: bun scripts/cloudflare/check-drift.ts "$STAGE"
