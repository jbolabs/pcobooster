name: CI

on:
  pull_request:
    # `labeled` lets adding the `preview` label request a deploy for the current head.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Request a production deployment after checks pass
        type: boolean
        default: false

permissions:
  contents: read

# Concurrency is per job: a new pull request push cancels that PR's older checks, but
# deployment jobs never interrupt an Alchemy state update.

jobs:
  quality:
    # A `labeled` event carries no new code; preview reuses the head's existing checks.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # PRs reuse content-addressed results; main executes every gate afresh before deploy.
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: quality-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull requests diff against their base to choose the affected packages.
          fetch-depth: 0

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Cache validation tasks
        uses: ./.github/actions/turbo-cache

      - name: Lint workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Lint
        run: bunx turbo run //#lint:ci

      # Use the same conservative scope as local ci:affected. Main always runs everything.
      - name: Choose affected packages
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci/affected.ts --github

      - name: Typecheck
        run: bun run typecheck ${{ steps.scope.outputs.args }}

  tests:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [application, worker, guards]
    env:
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
      BASE: ${{ github.event.pull_request.base.sha }}
    concurrency:
      group: tests-${{ matrix.lane }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Cache validation tasks
        uses: ./.github/actions/turbo-cache
        with:
          partition: ${{ matrix.lane }}
      - name: Run affected test lane
        run: bun scripts/ci/test-lane.ts "${{ matrix.lane }}"

  ci:
    needs: [quality, tests]
    if: always() && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation lane
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$QUALITY" = success && test "$TESTS" = success

  cloudflare-build:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-build-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Cache validation tasks
        uses: ./.github/actions/turbo-cache
      - name: Build Cloudflare bundles without credentials
        run: bun run build:cloudflare

  preview-gate:
    # On `labeled` the check jobs are skipped, so this waits on the head's earlier checks. A PR
    # opened with the label also starts an `opened` run that deploys the same head; the gate
    # leaves the deploy to it instead of deploying twice.
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'preview' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Require passing checks for the labeled head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 60); do
            pending=0
            for check in ci cloudflare-build; do
              # Newest non-skipped run of each required check on this head.
              result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?check_name=$check&filter=all" \
                --jq '[.check_runs[] | select(.conclusion != "skipped")] | sort_by(.started_at) | last | (.conclusion // .status // "missing")')
              case "$result" in
                success) ;;
                queued | requested | in_progress | pending | waiting) pending=1 ;;
                *) echo "::error::$check is $result for $EXPECTED_HEAD; push or re-run checks before requesting a preview."; exit 1 ;;
              esac
            done
            [ "$pending" = 0 ] && exit 0
            sleep 20
          done
          echo "::error::Checks for $EXPECTED_HEAD did not finish in time."
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Leave the deploy to a run already deploying this head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/cloudflare/preview-gate.ts

  preview:
    needs: [ci, cloudflare-build, preview-gate]
    # Previews deploy only on request: the `preview` label is the approval. Re-running this job
    # always deploys, even where the gate left the first attempt's deploy to another run.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview') && (github.event.action != 'labeled' || github.event.label.name == 'preview') && (needs.preview-gate.outputs.deploy != 'false' || github.run_attempt != '1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: cloudflare-preview
      url: https://pcobooster-pr-${{ github.event.pull_request.number }}-web.jakebodea.workers.dev
    concurrency:
      group: cloudflare-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PCOBOOSTER_ADMIN_EMAILS: ${{ vars.PCOBOOSTER_ADMIN_EMAILS }}
      STAGING_ACCESS_SERVICE_TOKEN_ID: ${{ vars.STAGING_ACCESS_SERVICE_TOKEN_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}
      PREVIEW_ORIGIN: https://pcobooster-pr-${{ github.event.pull_request.number }}-web.jakebodea.workers.dev
    steps:
      - name: Checkout verified merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      # A closed PR needs no preview and a newer head's own run deploys it, so these end green
      # without deploying instead of failing the run.
      - name: Skip closed or superseded preview revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | join(":")')
          if [ "$current" = "open:$EXPECTED_HEAD" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the preview: the pull request is now $current."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy labeled preview
        if: steps.current.outputs.deploy == 'true'
        run: bun alchemy deploy --stage "$PREVIEW_STAGE" --no-input --yes
      - name: Verify preview serves this commit
        if: steps.current.outputs.deploy == 'true'
        run: bun scripts/cloudflare/verify-deployment.ts "$PREVIEW_ORIGIN" "$GITHUB_SHA"

  staging:
    needs: [ci, cloudflare-build]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: cloudflare-staging
      url: https://pcobooster-staging-web.jakebodea.workers.dev
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PCOBOOSTER_ADMIN_EMAILS: ${{ vars.PCOBOOSTER_ADMIN_EMAILS }}
      STAGING_ACCESS_SERVICE_TOKEN_ID: ${{ vars.STAGING_ACCESS_SERVICE_TOKEN_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout verified staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      # The newer revision's own run deploys it, so a superseded run ends green without deploying
      # instead of failing the run on `main`.
      - name: Skip superseded staging revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the staging deploy: main has moved on to $current."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      # This environment supplies staging's Access service token and its id.
      - name: Deploy staging revision
        if: steps.current.outputs.deploy == 'true'
        run: bun alchemy deploy --stage staging --no-input --yes
      # Passes Cloudflare Access with CLOUDFLARE_ACCESS_CLIENT_ID and CLOUDFLARE_ACCESS_CLIENT_SECRET.
      - name: Verify staging serves this commit
        if: steps.current.outputs.deploy == 'true'
        run: bun scripts/cloudflare/verify-deployment.ts https://pcobooster-staging-web.jakebodea.workers.dev "$GITHUB_SHA"

  production:
    # Staging deploys the same revision first, so a failing migration or deploy stops here.
    needs: [ci, cloudflare-build, staging]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
      url: https://pcobooster.com
    concurrency:
      group: cloudflare-prod
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PCOBOOSTER_ADMIN_EMAILS: ${{ vars.PCOBOOSTER_ADMIN_EMAILS }}
      POSTHOG_ANNOTATION_API_KEY: ${{ secrets.POSTHOG_ANNOTATION_API_KEY }}
      CLOUDFLARE_CUSTOM_DOMAINS: ${{ vars.CLOUDFLARE_CUSTOM_DOMAINS }}
    steps:
      - name: Checkout verified production commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      # The newer revision's own run deploys it, so a superseded run ends green without deploying
      # instead of failing the run on `main`.
      - name: Skip superseded production revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the production deploy: main has moved on to $current."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      # Records the live pages so the IndexNow step below submits only what this deploy changed.
      # Warns and continues on failure; never fails the deploy.
      - name: Snapshot public pages for IndexNow
        if: steps.current.outputs.deploy == 'true'
        run: bun scripts/search/indexnow.ts snapshot https://pcobooster-prod-web.jakebodea.workers.dev "$RUNNER_TEMP/indexnow-before.json"
      - name: Deploy production revision
        if: steps.current.outputs.deploy == 'true'
        run: bun alchemy deploy --stage prod --no-input --yes
      # Through workers.dev: Bot Fight Mode challenges runners on pcobooster.com, and the Free plan
      # cannot exempt them. The custom domains route to the Worker script, so reading their
      # attachment from the Cloudflare API covers pcobooster.com without an edge request.
      - name: Verify production serves this commit
        if: steps.current.outputs.deploy == 'true'
        run: bun scripts/cloudflare/verify-deployment.ts https://pcobooster-prod-web.jakebodea.workers.dev "$GITHUB_SHA"
      - name: Verify pcobooster.com routes to the production Worker
        if: steps.current.outputs.deploy == 'true'
        run: bun scripts/cloudflare/verify-custom-domains.ts pcobooster-prod-web pcobooster.com www.pcobooster.com
      # Warns and continues on failure; never fails the deploy.
      - name: Submit changed public pages to IndexNow
        if: steps.current.outputs.deploy == 'true'
        run: bun scripts/search/indexnow.ts submit https://pcobooster-prod-web.jakebodea.workers.dev "$RUNNER_TEMP/indexnow-before.json"
      # Warns and skips when POSTHOG_ANNOTATION_API_KEY is absent; never fails the deploy.
      - name: Mark the deploy on PostHog charts
        if: steps.current.outputs.deploy == 'true'
        run: bun scripts/posthog/annotate-deploy.ts "$GITHUB_SHA"
