name: Setup toolchain
description: Pin Node and Bun (from .node-version and package.json), restore the Bun package cache, and install the frozen workspace.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version

    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    # Keep only this lockfile's packages, rather than restoring an ever-growing shared cache.
    - name: Restore Bun package cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/bun-package-cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-packages-v2-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-package-cache
      run: LEFTHOOK=0 bun install --frozen-lockfile
