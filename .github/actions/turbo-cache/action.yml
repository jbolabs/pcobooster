name: Cache validation tasks
description: Restore content-addressed Turbo results for secretless validation jobs only.

runs:
  using: composite
  steps:
    - name: Restore Turbo task cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-v1-${{ github.job }}-${{ hashFiles('bun.lock', 'package.json', '.node-version', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-v1-${{ github.job }}-${{ hashFiles('bun.lock', 'package.json', '.node-version', 'turbo.json') }}-
